name: Game tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test game state and reconnect rules without a database
        run: bash gradlew test --tests '*GameRecoveryTest' --tests '*GameConnectionTest'
